<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: salle de boxe la nuit. Fond noir chaud, or du logo, une bande tricolore fine comme le mongkol. Sections en bandes pleine largeur. */
:root{
  --bg:#0d0b09; --bg-2:#16130f; --bg-3:#201b15; --line:#3a3125;
  --fg:#f3ece0; --muted:#b4a790; --gold:#e0b04a; --gold-2:#f5cf72; --gold-ink:#1a1206;
  --red:#d2453c; --blue:#3c6fd2; --ok:#6fbf73;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--gold-2)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-label);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.mongkol{height:4px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--fg) 33.3% 66.6%,var(--blue) 66.6%)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top > .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0;margin-right:auto}
.brand img{width:42px;height:42px;flex:0 0 auto}
.brand span{display:flex;flex-direction:column;line-height:.95;font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--f-label);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--gold);margin-top:3px}
nav.links{display:flex;gap:2px;align-items:center}
nav.links a{position:relative;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--muted);text-decoration:none;padding:10px 11px;border-radius:6px;white-space:nowrap;transition:color .2s}
nav.links a::after{content:"";position:absolute;left:11px;right:11px;bottom:4px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.links a:hover{color:var(--fg)}
nav.links a.on{color:var(--fg)}
nav.links a.on::after,nav.links a:hover::after{transform:scaleX(1)}
.nav-cta{white-space:nowrap}
.burger{display:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.burger span{display:block;width:20px;height:2px;background:var(--fg);border-radius:2px;transition:transform .25s,opacity .2s}
.top.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.top.open .burger span:nth-child(2){opacity:0}
.top.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu-panel{position:fixed;left:0;right:0;top:calc(65px + env(safe-area-inset-top,0px));bottom:0;z-index:30;background:var(--bg);overflow:auto;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);animation:drop .25s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.menu-panel .wrap{display:flex;flex-direction:column;gap:24px;padding-block:12px 32px}
.menu-panel nav{display:flex;flex-direction:column}
.menu-panel nav a{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.menu-panel nav a span{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.menu-panel nav a small{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:right}
.menu-panel nav a.on span{color:var(--gold)}
.menu-contact{display:flex;flex-direction:column;gap:12px}
.menu-contact .btn{justify-content:center}
.menu-contact p{margin:0;color:var(--muted);font-size:15px}
.menu-contact p b{color:var(--fg)}
@media (max-width:1020px){nav.links{display:none}.burger{display:flex}}
@media (max-width:520px){.brand span{font-size:18px}.brand small{display:none}.brand img{width:36px;height:36px}.nav-cta{padding:8px 10px;font-size:12px}}
@media (max-width:360px){.brand span{display:none}}

/* Hero */
@keyframes rise{from{transform:translateY(14px) scale(.97)}to{transform:none}}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:12px 20px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;color:var(--gold-2)}
.btn.ghost:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

/* Accueil : arène hologramme */
.arena{position:relative;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line);min-height:min(820px,calc(100svh - 68px));display:flex;flex-direction:column;justify-content:center;
  background:radial-gradient(ellipse 55% 60% at 70% 52%,rgba(224,176,74,.26),transparent 65%),radial-gradient(circle at 70% 52%,#1a140b,#000 70%)}
.arena .scan{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
.arena .sweep{position:absolute;left:0;right:0;height:140px;z-index:3;pointer-events:none;background:linear-gradient(transparent,rgba(245,207,114,.07),transparent);animation:arSweep 6s linear infinite}
@keyframes arSweep{from{top:-140px}to{top:100%}}
.arena .ar-ghost{position:absolute;left:0;top:10%;font:900 min(24vw,330px)/.8 var(--f-display);color:transparent;-webkit-text-stroke:1px rgba(224,176,74,.16);white-space:nowrap;animation:arDrift 22s linear infinite alternate;pointer-events:none}
@keyframes arDrift{from{transform:translateX(-4%)}to{transform:translateX(-18%)}}
.arena .corner{position:absolute;width:26px;height:26px;border:2px solid var(--gold);z-index:4;animation:arBlink 2.4s ease-in-out infinite}
.arena .c1{top:20px;left:20px;border-right:0;border-bottom:0}.arena .c2{top:20px;right:20px;border-left:0;border-bottom:0;animation-delay:.6s}.arena .c3{bottom:84px;left:20px;border-right:0;border-top:0;animation-delay:1.2s}.arena .c4{bottom:84px;right:20px;border-left:0;border-top:0;animation-delay:1.8s}
@keyframes arBlink{50%{opacity:.25}}
.arena > .wrap{position:relative;z-index:5;width:100%;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:20px;padding-block:56px 120px}
.arena .txt{min-width:0}
.arena h1{font-size:clamp(60px,8.4vw,120px);font-weight:900;line-height:.92;margin:18px 0 22px}
.arena h1 span{display:block}
.arena .in{animation:arIn .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 120ms)}
@keyframes arIn{from{transform:translateY(28px);opacity:.001}to{transform:none;opacity:1}}
.arena .gl{white-space:nowrap;padding-top:.14em;margin-top:-.14em;background:linear-gradient(100deg,#b8862b 0%,#f5cf72 30%,#fff6da 45%,#f5cf72 60%,#b8862b 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(224,176,74,.35));animation:arIn .9s cubic-bezier(.2,.8,.2,1) both,arSheen 3.5s ease-in-out infinite;animation-delay:240ms,1s}
@keyframes arSheen{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
.arena p.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:32ch;margin:0 0 28px}
.arena .cta .btn{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.arena .stage{position:relative;justify-self:center;width:min(500px,100%);aspect-ratio:1;display:grid;place-items:center}
.arena .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(224,176,74,.35)}
.arena .r2{inset:6%;border:2px dashed rgba(224,176,74,.55);animation:arSpin 40s linear infinite}
.arena .r3{inset:-6%;border:0;background:conic-gradient(from 0deg,transparent 0 62%,rgba(245,207,114,.95) 74%,transparent 76%);-webkit-mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 67.6%,transparent 68%);mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 67.6%,transparent 68%);animation:arSpin 4s linear infinite}
.arena .r4{inset:12%;border:0;background:conic-gradient(from 180deg,transparent 0 80%,rgba(210,69,60,.8) 88%,transparent 90%);-webkit-mask:radial-gradient(circle,transparent 69%,#000 69.5%,#000 70.6%,transparent 71%);mask:radial-gradient(circle,transparent 69%,#000 69.5%,#000 70.6%,transparent 71%);animation:arSpin 6s linear infinite reverse}
.arena .ticks{position:absolute;inset:-1%;border-radius:50%;background:repeating-conic-gradient(rgba(224,176,74,.6) 0 .4deg,transparent .4deg 6deg);-webkit-mask:radial-gradient(circle,transparent 69%,#000 69.5%,#000 71.5%,transparent 72%);mask:radial-gradient(circle,transparent 69%,#000 69.5%,#000 71.5%,transparent 72%);animation:arSpin 60s linear infinite reverse}
@keyframes arSpin{to{transform:rotate(360deg)}}
.arena .logo{width:76%;position:relative;z-index:2;animation:arFloat 5s ease-in-out infinite,arGlow 3s ease-in-out infinite}
@keyframes arFloat{50%{transform:translateY(-12px)}}
@keyframes arGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(224,176,74,.35)) drop-shadow(0 30px 40px #000)}50%{filter:drop-shadow(0 0 70px rgba(245,207,114,.7)) drop-shadow(0 30px 40px #000)}}
.arena .hud{position:absolute;z-index:3;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;padding:8px 12px;border:1px solid rgba(224,176,74,.5);background:rgba(13,11,9,.78);backdrop-filter:blur(4px);text-decoration:none;max-width:70%}
a.hud:hover{border-color:var(--gold)}
.arena .hud b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--fg);text-transform:uppercase}
.arena .hud::before{content:"";position:absolute;left:-1px;top:-1px;width:8px;height:8px;background:var(--gold)}
.arena .h1p{top:6%;right:-4%;animation:arPop .6s 1.1s both,arBob 4s 1.7s ease-in-out infinite}
.arena .h2p{bottom:9%;left:-8%;animation:arPop .6s 1.4s both,arBob 4s 2s ease-in-out infinite reverse}
@keyframes arPop{from{transform:scale(.6);opacity:.001}to{transform:none;opacity:1}}
@keyframes arBob{50%{transform:translateY(-6px)}}
.arena .tick{position:absolute;left:-2%;right:-2%;bottom:18px;z-index:11;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:10px 0;transform:rotate(-1.2deg);overflow:hidden;display:flex}
.arena .track{display:flex;flex:0 0 auto;animation:arMarq 26s linear infinite}
.arena .track span{padding:0 18px}
@keyframes arMarq{to{transform:translateX(-100%)}}
@media (max-width:900px){.arena .hud{padding:6px 10px;font-size:11px}.arena .hud b{font-size:18px}.arena > .wrap{grid-template-columns:1fr;padding-block:28px 110px}.arena .stage{order:-1;width:min(340px,80vw)}.arena .h2p{left:-4%}.arena .h1p{right:-4%}.arena .corner{display:none}.arena .tick{font-size:18px}}

/* Sections */
section.band{border-bottom:1px solid var(--line)}
section.band > .wrap{padding-block:64px}
section.band.alt{background:var(--bg-2)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.sec-head h2{font-size:clamp(38px,6vw,64px);font-weight:800;margin-top:8px}
.sec-head p{color:var(--muted);max-width:52ch;margin:0}
@media (max-width:760px){section.band > .wrap{padding-block:44px}}

/* Club */
.club-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px}
.club-grid .text p{margin:0 0 14px;max-width:62ch}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:24px}
.values div{background:var(--bg);padding:16px}
.values b{display:block;font-family:var(--f-display);font-size:24px;text-transform:uppercase;color:var(--gold)}
.values span{font-size:14px;color:var(--muted)}
.disc{display:flex;flex-direction:column;gap:14px}
.disc article{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.disc .k{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--gold);padding-top:6px;text-transform:uppercase}
.disc h3{font-size:28px;font-weight:800}
.disc p{grid-column:2;margin:0;color:var(--muted);font-size:15px}
@media (max-width:860px){.club-grid{grid-template-columns:1fr}.values{grid-template-columns:1fr}}

/* Planning */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.notice{display:flex;gap:10px;align-items:flex-start;border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 7%,transparent);color:var(--fg);padding:12px 14px;border-radius:var(--r);margin-bottom:18px;font-size:15px}
.notice b{color:var(--gold-2)}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.day{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.day h3{font-size:26px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day h3 small{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;color:var(--gold-ink);background:var(--gold);padding:2px 7px;border-radius:4px}
.sess{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.sess .t{font-family:var(--f-label);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold-2)}
.sess .c{font-weight:600}
.sess .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pub{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--bg-3);color:var(--fg)}
.pub[data-p="Enfants"]{background:#2d3a22;color:#cfe8b0}
.pub[data-p="Ados"]{background:#22303d;color:#b6d4ef}
.pub[data-p="Adultes"]{background:#3d2a1c;color:#f0c9a4}
.pub[data-p="Femmes"]{background:#3d1f31;color:#f2b6d6}
.pub[data-p="Compétition"]{background:#3d1d1b;color:#f5b0a8}
.ex{font-size:12px;color:var(--muted);font-style:italic}
.sess .coach{font-size:14px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:26px;text-transform:uppercase;margin-bottom:6px}

/* Tarifs */
.tarif-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.prices{display:flex;flex-direction:column}
.price{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.price:first-child{border-top:1px solid var(--line)}
.price h3{font-size:26px;font-weight:800}
.price .amt{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.price p{margin:0;color:var(--muted);font-size:15px}
.docs{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.docs h3{font-size:26px;font-weight:800;margin-bottom:10px}
.docs ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.docs li{display:flex;gap:10px;font-size:15px}
.docs li::before{content:"";flex:0 0 8px;height:8px;margin-top:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.docs .essai{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
@media (max-width:860px){.tarif-grid{grid-template-columns:1fr}}

/* Actus */
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.post{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post:first-child{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.post time{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.post h3{font-size:28px;font-weight:800}
.post p{margin:0;color:var(--muted);font-size:15px;white-space:pre-line}

/* Coachs */
.coachs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.coach-card{border-top:2px solid var(--gold);padding-top:14px}
.coach-card .ini{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bg-3);border:1px solid var(--gold);font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold);margin-bottom:10px}
.coach-card h3{font-size:26px;font-weight:800}
.coach-card .role{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--gold-2);margin:4px 0 6px}
.coach-card p{margin:0;color:var(--muted);font-size:15px}

/* Tenue */
.kit{display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:center}
.kit-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kit-photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.kit p{color:var(--muted);margin:0 0 12px;max-width:56ch}
.kit ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:16px 0 0}
@media (max-width:860px){.kit{grid-template-columns:1fr}}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cards{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.crow .lab{font-family:var(--f-label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.crow .val{font-weight:600;min-width:0;overflow-wrap:anywhere;user-select:all}
.crow .val a{color:var(--fg);text-decoration:none}
.place{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.place::after{content:"26800";position:absolute;right:-6px;bottom:-22px;font-family:var(--f-display);font-weight:900;font-size:120px;color:color-mix(in srgb,var(--gold) 8%,transparent);pointer-events:none}
.place h3{font-size:34px;font-weight:800}
.place address{font-style:normal;font-size:18px}
.place p{margin:0;color:var(--muted);font-size:15px;max-width:44ch}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}.crow{grid-template-columns:1fr auto}.crow .lab{grid-column:1/-1}}

footer{padding-block:28px 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
footer .flags{font-family:var(--f-label);letter-spacing:.12em;text-transform:uppercase}

/* Admin */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.admin{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.admin-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg-2)}
.admin-bar h2{font-size:26px;font-weight:800;margin-right:auto}
.admin-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
.admin-tabs button{font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
.admin-tabs button[aria-selected="true"]{color:var(--gold-2);border-bottom-color:var(--gold)}
.admin-body{flex:1;overflow:auto}
.admin-body .wrap{max-width:860px;padding-block:20px 80px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}

<script type="application/json" id="club-data">{"saison":"2026-2027","maj":"2026-10-20","club":{"nom":"Montoiz’ Thaï Khmer Boxing","accroche":"Boxe thaï, boxe khmère et boxes d’Asie du Sud-Est à Montoison, pour les enfants comme pour les adultes.","presentation":"Montoiz’ Thaï Khmer Boxing est une jeune association sportive de la Drôme, anciennement Allex Thaï Khmer Boxing. Le club a pris son nouveau nom en septembre 2026, après une assemblée générale extraordinaire.\n\nGrâce à la mairie de Montoison, qui met gracieusement une salle dédiée à notre disposition, nous transmettons notre passion de la boxe thaïlandaise, de la boxe khmère et des sports de combat d’Asie du Sud-Est dans de bonnes conditions.\n\nNotre ambition : construire, avec les habitants, les associations et les acteurs de la commune, un club convivial, familial et ambitieux.","adresse":"2 Place de l’Église (ou Grande Rue)","ville":"26800 Montoison","acces":"Salle mise à disposition par la commune de Montoison, au centre du village.","tel":"06 58 40 32 45","whatsapp":"+33 6 58 40 32 45","email":"allexthaikhmerboxing@gmail.com","facebook":"","tiktok":"","instagram":""},"planning":[{"id":"p1","jour":2,"debut":"18:00","fin":"19:30","cours":"Boxe thaï & khmère enfants","public":"Enfants","coach":"","exemple":true},{"id":"p4","jour":4,"debut":"19:00","fin":"21:00","cours":"Adultes tous niveaux","public":"Adultes","coach":"","exemple":true},{"id":"kao17h3","jour":2,"debut":"19:30","fin":"21:00","cours":"","public":"Adultes","coach":"","exemple":false},{"id":"ftb0ggi","jour":4,"debut":"18:00","fin":"19:30","cours":"","public":"Enfants","coach":"","exemple":false}],"tarifs":[],"documents":["Fiche d’inscription remplie et signée","Certificat médical ou questionnaire de santé","Autorisation parentale pour les mineurs","Règlement de la cotisation"],"essai":"Envie d’essayer ? Contactez le club par téléphone, WhatsApp ou e-mail pour convenir d’un cours d’essai.","actus":[{"id":"a3","date":"2026-10-20","titre":"La t   {id:"affil-2026",run(D){
    D.actus=D.actus||[];
    if(!D.actus.some(a=>a.id==="actu-affiliation-2026")) D.actus.unshift({id:"actu-affiliation-2026",date:"2026-10-22",titre:"Le club s’affilie à la FFKMDA et à la WMO France",photo:"",

async function sendForm(){
  FORM.err="";
  if(!FORM.nom.trim()) FORM.err="Indiquez votre nom.";
  else if(!FORM.tel.trim()&&!/^\S+@\S+\.\S+$/.test(FORM.email)) FORM.err="Indiquez un téléphone ou un e-mail valide pour que le club puisse vous répondre.";
  else if(!FORM.ok) FORM.err="Cochez la case d’accord pour que le club puisse vous recontacter.";
  if(FORM.err){refreshForm();return}
  if(document.getElementById("fm-hp")?.value) return;
  FORM.status="sending";refreshForm();
  const to=DATA.club.formEmail||DATA.club.email;
  const t=TYPES.find(x=>x[0]===FORM.type)[1];
  try{
    const r=await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(to),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({_subject:`[Site] ${t} – ${FORM.nom}`,_template:"table",_captcha:"false",...(FORM.email?{_replyto:FORM.email}:{}),"Type de demande":t,"Nom":FORM.nom,"Téléphone":FORM.tel,"E-mail":FORM.email,"Pour":FORM.type==="essai"||FORM.type==="inscription"?FORM.pour+(FORM.age?` (${FORM.age} ans)`:""):"","Cours souhaité":FORM.cours,"Message":FORM.message})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&String(j.success)==="true"){FORM.status="sent"}
    else{FORM.status="idle";FORM.err="La demande n’a pas pu être envoyée pour le moment. Utilisez WhatsApp ou l’e-mail ci-dessous.";}
  }catch(_){FORM.status="idle";FORM.err="Pas de connexion. Réessayez, ou utilisez WhatsApp ou l’e-mail ci-dessous.";}
  refreshForm();
}

function nextSession(list){
  if(!list||!list.length) return null;
  const now=new Date(),dow=(now.getDay()+6)%7,hm=now.toTimeString().slice(0,5);
  let best=null;
  for(const s of list){let d=(s.jour-dow+7)%7;if(d===0&&s.debut<=hm)d=7;if(!best||d<best.d||(d===best.d&&s.debut<best.s.debut))best={s,d}}
  return best;
}

const SL={i:0,timer:null,paused:false,user:false,hover:false,visible:true,obs:null,dur:5000};
function initSlider(){
  clearTimeout(SL.timer);if(SL.obs)SL.obs.disconnect();
  const track=document.getElementById("slides");if(!track) return;
  const n=track.children.length;SL.i=Math.min(SL.i,n-1);SL.user=SL.user||RM();
  const sl=document.getElementById("slider");
  if(SL.i) track.scrollLeft=SL.i*(track.children[0].offsetWidth+12);
  let raf=0;
  track.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const w=track.children[0].offsetWidth+12;const i=Math.round(track.scrollLeft/w);if(i!==SL.i){SL.i=i;slUI();slSchedule()}})},{passive:true});
  sl.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){SL.hover=true;slSchedule()}});
  sl.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){SL.hover=false;slSchedule()}});
  sl.addEventListener("focusin",()=>{SL.hover=true;slSchedule()});
  sl.addEventListener("focusout",()=>{SL.hover=false;slSchedule()});
  track.addEventListener("touchstart",()=>{SL.hover=true;slSchedule()},{passive:true});
  track.addEventListener("touchend",()=>{setTimeout(()=>{SL.hover=false;slSchedule()},4000)},{passive:true});
  if("IntersectionObserver" in window){SL.obs=new IntersectionObserver(es=>{SL.visible=es[0].isIntersecting;slSchedule()},{threshold:.35});SL.obs.observe(sl)}
  slUI();slSchedule();
}

const field=(label,path,val,opts={})=>{
  const id="f-"+path.replace(/[^\w]/g,"-");
  const cls=opts.full?"f full":"f";
  if(opts.type==="textarea") return `<label class="${cls}" for="${id}">${label}<textarea id="${id}" data-path="${path}">${esc(val)}</textarea></label>`;
  if(opts.type==="select") return `<label class="${cls}" for="${id}">${label}<select id="${id}" data-path="${path}" ${opts.num?'data-num="1"':""}>${opts.options.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val)?" selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(opts.type==="checkbox") return `<label class="f inline ${opts.full?"full":""}" for="${id}"><input type="checkbox" id="${id}" data-path="${path}" data-bool="1"${val?" checked":""}>${label}</label>`;
  return `<label class="${cls}" for="${id}">${label}<input id="${id}" type="${opts.type||"text"}" data-path="${path}" value="${esc(val)}" ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}></label>`;
};

const b64=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
async function ghPut(content,retry){
  const url=`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/donnees.json`;
  const hd={"Authorization":"Bearer "+GH.token,"Accept":"application/vnd.github+json"};
  let sha;const g=await fetch(url+"?t="+Date.now(),{headers:hd,cache:"no-store"});
  if(g.ok){sha=(await g.json()).sha}else if(g.status!==404){throw g.status}
  const r=await fetch(url,{method:"PUT",headers:hd,body:JSON.stringify({message:"Mise à jour du site ("+new Date().toLocaleDateString("fr-FR")+")",content:b64(content),...(sha?{sha}:{})})});
  if(r.status===409&&!retry) return ghPut(content,true);
  if(!r.ok) throw r.status;
}
async function save(){
  if(saving||!GH.token) return;
  saving=true;renderAdmin();
  const next=JSON.parse(JSON.stringify(draft));
  next.maj=new Date().toISOString().slice(0,10);
  try{
    await ghPut(JSON.stringify(next,null,2));
    DATA=next;dirty=false;draft=null;saving=false;render();
    toast("Enregistré. Le site public se met à jour d’ici 1 à 2 minutes.");
  }catch(st){
    saving=false;renderAdmin();
    if(st===401) toast("Jeton refusé : il est expiré ou mal copié. Vérifiez l’onglet Connexion.");
    else if(st===403||st===404) toast("Accès refusé : vérifiez le compte, le dépôt et la permission Contents du jeton.");
    else if(st===409) toast("Le fichier a changé entre-temps. Rechargez la page puis recommencez.");
    else toast("L’enregistrement n’a pas abouti. Vérifiez la connexion internet et réessayez.");
  }
}

async function ghPutFile(path,content,message){
  const url=`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${path}`;
  const r=await fetch(url,{method:"PUT",headers:{"Authorization":"Bearer "+GH.token,"Accept":"application/vnd.github+json"},body:JSON.stringify({message,content})});
  if(!r.ok) throw r.status;
}
async function shrink(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(_){src=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file)})}
  const max=1600,w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  const png=file.type==="image/png"||file.type==="image/svg+xml"||file.type==="image/webp";
  return c.toDataURL(png?"image/png":"image/jpeg",0.85);
}
async function uploadPhoto(file){
  const dataUrl=await shrink(file);
  const path=`photos/${new Date().toISOString().slice(0,10)}-${uid()}.${dataUrl.startsWith("data:image/png")?"png":"jpg"}`;
  await ghPutFile(path,dataUrl.split(",")[1],"Ajout d’une photo");
  PREV[path]=dataUrl;
  return path;
}
async function handleFiles(files,onDone){
  if(!GH.token){toast("Connectez-vous d’abord dans l’onglet Connexion.");return}
  for(const f of files){
    uploading++;renderAdmin();
    try{const p=await uploadPhoto(f);onDone(p);dirty=true}
    catch(st){toast(st===401?"Jeton refusé : vérifiez l’onglet Connexion.":st===403||st===404?"Accès refusé au dépôt : vérifiez le jeton.":"Une photo n’a pas pu être envoyée. Réessayez.")}
    uploading--;renderAdmin();
  }
  if(!uploading) toast("Photo(s) ajoutée(s). Enregistrez pour publier.");
}

    const taille=(sz&&sz.value)||"";if(sz&&sz.tagName==="SELECT"&&!taille){sz.focus();toast("Choisissez une taille.");return}
    const q=Math.max(1,Math.min(20,parseInt(qt&&qt.value,10)||1));const ex=CART.find(l=>l.aid===id&&l.taille===taille);
    if(ex)ex.qty=Math.min(50,ex.qty+q);else CART.push({aid:id,taille,qty:q});saveCart();if(ORDER.status==="sent")ORDER.status="idle";refreshCart();
    const a=DATA.boutique.articles.find(x=>x.id===id);toast(`${q} × ${a?a.nom:"article"}${taille?" ("+taille+")":""} ajouté au panier.`);return}
  if(el.dataset.cartqty){const [i,d]=el.dataset.cartqty.split(":").map(Number);CART[i].qty+=d;if(CART[i].qty<1)CART.splice(i,1);saveCart();refreshCart();return}
  if(el.dataset.cartdel!==undefined){CART.splice(+el.dataset.cartdel,1);saveCart();refreshCart();return}
  if(el.id==="order-new"){ORDER.status="idle";ORDER.message="";refreshCart();return}
  if(el.id==="tt-add"&&draft){const inp=document.getElementById("tt-url");const url=(inp.value||"").trim();
    if(!/^https?:\/\/([a-z]+\.)?tiktok\.com\//i.test(url)){toast("Collez un lien TikTok qui commence par https://www.tiktok.com/ ou https://vm.tiktok.com/");inp.focus();return}
    draft.galerie=draft.galerie||[];draft.galerie.unshift({id:uid(),type:"tiktok",url,legende:""});dirty=true;renderAdmin();hydrateTT();
    toast(ttId(url)?"Vidéo ajoutée en tête de galerie. Enregistrez pour publier.":"Lien court ajouté : la vidéo s’ouvrira sur TikTok. Pour la lire dans le site, ouvrez le lien et copiez l’adresse complète.");return}
  if(el.dataset.lb){openLightbox(lbI+ +el.dataset.lb);return}
  if(el.id==="lb-close"){closeLightbox();return}
  if(el.dataset.sl){slGo(SL.i+ +el.dataset.sl);return}
  if(el.dataset.dot!==undefined){slGo(+el.dataset.dot);return}
  if(el.id==="sl-play"){SL.user=!SL.user;slUI();slSchedule();return}
  if(el.dataset.install!==undefined){installApp();return}
  if(el.id==="sheet-x"){closeSheet();return}
  if(el.id==="burger"){setMenu(!menuOpen);slSchedule();return}
  if(el.dataset.photoDel){setPath(draft,el.dataset.photoDel,"");dirty=true;renderAdmin();return}
  if(el.dataset.move){const [i,dir]=el.dataset.move.split(":").map(Number);const g=draft.galerie;[g[i],g[i+dir]]=[g[i+dir],g[i]];dirty=true;renderAdmin();return}
  if(el.dataset.copy!==undefined){const v=el.dataset.copy;const done=()=>{el.textContent="Copié";setTimeout(()=>el.textContent="Copier",1500)};
    try{navigator.clipboard.writeText(v).then(done,()=>{selectNear(el)})}catch(_){selectNear(el)}return}
  if(el.id==="open-admin"){openAdmin();return}
  if(el.id==="gh-save"){GH.owner=document.getElementById("gh-owner").value.trim();GH.repo=document.getElementById("gh-repo").value.trim();GH.token=document.getElementById("gh-token").value.trim();storeGH();tab=GH.token?"infos":"connexion";renderAdmin();toast(GH.token?"Connexion enregistrée sur cet appareil.":"Collez un jeton pour vous connecter.");return}
  if(el.id==="gh-logout"){GH.token="";storeGH();renderAdmin();toast("Jeton supprimé de cet appareil.");return}
  if(el.id==="close-admin"){draft=null;dirty=false;confirmDel=null;if(location.hash==="#bureau")history.replaceState(null,"",page==="accueil"?location.pathname+location.search:"#"+page);renderAdmin();return}
  if(el.id==="save-admin"){save();return}
  if(el.dataset.tab){tab=el.dataset.tab;confirmDel=null;renderAdmin();return}
  if(el.dataset.add){const l=el.dataset.add;const it=BLANK[l]();const arr=getPath(draft,l);l==="actus"||l==="agenda"?arr.unshift(it):arr.push(it);dirty=true;renderAdmin();return}
  if(el.dataset.askDel){confirmDel=el.dataset.askDel;renderAdmin();return}
  if(el.dataset.cancelDel!==undefined){confirmDel=null;renderAdmin();return}
  if(el.dataset.amove){const [i,d]=el.dataset.amove.split(":").map(Number);const A=draft.boutique.articles;[A[i],A[i+d]]=[A[i+d],A[i]];dirty=true;renderAdmin();return}
  if(el.dataset.del){const [l,i]=el.dataset.del.split(":");getPath(draft,l).splice(+i,1);confirmDel=null;dirty=true;renderAdmin();return}
});
function selectNear(el){const v=el.parentElement.querySelector(".val");if(!v)return;const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener("submit",e=>{if(e.target.id==="ask-form"){e.preventDefault();sendForm()}if(e.target.id==="order-form"){e.preventDefault();sendOrder()}});
document.addEventListener("input",e=>{
  {const t=e.target;if(t.dataset&&t.dataset.order){const k=t.dataset.order;ORDER[k]=t.type==="checkbox"?t.checked:t.value;if(k==="statut")refreshCart();return}}
  const t=e.target;
  if(t.dataset&&t.dataset.form){const k=t.dataset.form;FORM[k]=t.type==="checkbox"?t.checked:t.value;if(k==="type"||k==="pour")refreshForm();return} if(!draft||!t.dataset||!t.dataset.path) return;
  let v=t.dataset.bool?t.checked:t.value; if(t.dataset.num) v=+v;
  setPath(draft,t.dataset.path,v); markDirty();
});
document.addEventListener("keydown",e=>{
  if(document.querySelector(".lightbox")){if(e.key==="Escape")closeLightbox();else if(e.key==="ArrowRight")openLightbox(lbI+1);else if(e.key==="ArrowLeft")openLightbox(lbI-1);return}
  if(e.key==="Escape"&&document.querySelector(".sheet")){closeSheet();return}
  if(e.key==="Escape"){if(menuOpen){setMenu(false);document.getElementById("burger")?.focus()}if(document.querySelector(".legal"))hideLegal()}
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#slider")){if(e.key==="ArrowRight"){e.preventDefault();slGo(SL.i+1)}if(e.key==="ArrowLeft"){e.preventDefault();slGo(SL.i-1)}}
});
addEventListener("resize",()=>{if(menuOpen&&innerWidth>1020)setMenu(false);const t=document.getElementById("slides");if(t)t.scrollLeft=SL.i*(t.children[0].offsetWidth+12)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset&&t.dataset.galAdd&&draft){const fs=[...t.files];t.value="";handleFiles(fs,p=>draft.galerie.push({id:uid(),src:p,legende:""}));return}
  if(t.dataset&&t.dataset.photo&&draft){const fs=[...t.files].slice(0,1);const path=t.dataset.photo;t.value="";handleFiles(fs,p=>setPath(draft,path,p));return}if(draft&&t.dataset&&t.dataset.path&&(t.tagName==="SELECT"||t.dataset.bool))renderAdmin()});

function openAdmin(){draft=JSON.parse(JSON.stringify(DATA));draft.agenda=draft.agenda||[];draft.annonce=Object.assign({texte:"",actif:false,type:"info",jusqu:""},draft.annonce);draft.legal=Object.assign({president:"",rna:"",siret:""},draft.legal);draft.galerie=draft.galerie||[];dirty=false;confirmDel=null;tab=GH.token?"infos":"connexion";renderAdmin()}
function checkHash(){
  if(location.hash==="#bureau"){canWrite=true;render();if(!draft)openAdmin();return}
  if(location.hash==="#mentions"){showLegal();return}
  if(document.querySelector(".legal"))document.querySelector(".legal").remove(),document.body.style.overflow="";
  const p=pageFromHash()||"accueil";
  if(location.hash==="#demande"){if(page!=="contact"){page="contact";render()}setTimeout(()=>document.getElementById("demande")?.scrollIntoView(),50);return}
  if(p!==page){page=p;SL.i=0;render();window.scrollTo(0,0)}
}
canWrite=!!GH.token;
render();
fetch("donnees.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j){DATA=applySeeds(j);if(!draft)render()}}).catch(()=>{}).finally(checkHash);
addEventListener("hashchange",checkHash);
</script></body>
</html>
