<style>
:root{
  --bg:#0d0b09; --bg-2:#16130f; --bg-3:#201b15; --line:#3a3125;
  --fg:#f3ece0; --muted:#b4a790; --gold:#e0b04a; --gold-2:#f5cf72; --gold-ink:#1a1206;
  --red:#d2453c; --blue:#3c6fd2; --ok:#6fbf73; --warn:#e39a3b;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body)}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

button,input,select{font:inherit;color:inherit}

header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
header img{width:40px;height:40px;border-radius:50%}
header .t{flex:1;min-width:0}
header .t b{display:block;font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
header .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font:600 13px var(--f-label);letter-spacing:.08em;text-transform:uppercase}
header a.back{font:600 14px var(--f-label);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:24px 16px 80px}
h1{font:900 clamp(34px,7vw,52px)/.95 var(--f-display);text-transform:uppercase;margin:0 0 8px}
h1 em{font-style:normal;color:var(--gold)}

.lead{color:var(--muted);margin:0 0 22px;max-width:56ch}

.login{max-width:440px;margin:6vh auto 0}

.btn.danger{background:transparent;color:#ff8d84;border:1px solid #6b2a25}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}

.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-label);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#16301a;color:#9fe0a2}
.pill.ko{background:#3a1512;color:#ffa49b}

.pill.n{background:var(--bg-3);color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);
  font:700 15px var(--f-label);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 30px/1 var(--f-display)}
.stat small{color:var(--muted);font:600 12px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}

.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--bg-2);border:1px solid var(--line);

.item b{font-size:16px}
.item .meta{color:var(--muted);font-size:13px;grid-column:1}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* Fiche (feuille latérale) */
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:flex-end}

.sheet .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 14px 2px;margin:0 0 14px}
legend{font:700 13px var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:0 6px}

.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:6px}

.center{text-align:center}
.card-page{max-width:460px;margin:0 auto}
.mcard{position:relative;overflow:hidden;margin:18px 0 12px;aspect-ratio:1.586;border-radius:18px;border:1px solid #8a6a2c;padding:18px 18px 22px;
  background:linear-gradient(135deg,#2a2114 0%,#15110b 45%,#4a3916 100%);box-shadow:0 18px 50px #000a, inset 0 1px 0 #f5cf7240;display:flex;flex-direction:column;container-type:inline-size}
.mcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 9px);pointer-events:none}
.mcard.off{filter:grayscale(.85) brightness(.75)}
.mc-wm{position:absolute;right:-12%;bottom:-22%;width:62%;opacity:.13;pointer-events:none}
.mc-top{display:flex;align-items:center;gap:10px;position:relative}
.mc-top img{width:13cqw;height:13cqw;border-radius:50%}
.mc-top b{display:block;font:800 5cqw/0.95 var(--f-display);text-transform:uppercase}
.mc-top small{display:block;margin-top:3px;color:var(--gold);font:700 2.9cqw var(--f-label);letter-spacing:.18em;text-transform:uppercase}
.mc-season{margin-left:auto;align-self:flex-start;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);font:800 3.2cqw var(--f-label);letter-spacing:.12em;padding:4px 9px;border-radius:6px;white-space:nowrap}
.mc-name{position:relative;margin-top:auto;font:900 8.6cqw/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.mc-tags{position:relative;display:flex;gap:6px;margin:6px 0 0;min-height:6cqw}
.mc-tags span{font:700 3cqw var(--f-label);letter-spacing:.1em;text-transform:uppercase;border:1px solid #6b5630;color:var(--muted);border-radius:99px;padding:2px 9px}
.mc-tags span.hl{border-color:var(--gold);color:var(--gold-2)}
.mc-bottom{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.mc-bottom small{display:block;color:var(--muted);font:700 2.6cqw var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.mc-bottom b{display:block;font:800 4.6cqw/1.1 var(--f-label);margin-bottom:5px}
.mc-qr{width:27cqw;height:27cqw;background:#fff;border-radius:10px;padding:2.2cqw;flex:none}
.mc-qr svg{width:100%;height:100%;display:block}
button.mc-qr{border:0;cursor:zoom-in;position:relative}
.mc-zoom{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font:700 13px/22px var(--f-body);box-shadow:0 2px 6px #0008}
.qr-zoom{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;animation:qz .18s ease-out}
@keyframes qz{from{opacity:0;transform:scale(.96)}}
.qz-box{width:min(86vw,72vh,520px);aspect-ratio:1}
.qz-box svg{width:100%;height:100%;display:block}
.qz-name{margin:22px 0 4px;color:#111;font:800 24px var(--f-display);text-transform:uppercase;text-align:center}
.qz-num{margin:0 0 10px;color:#8a6a2c;font:700 15px var(--f-label);letter-spacing:.14em}
.qz-hint{margin:0;color:#666;font-size:14px;text-align:center}
.mc-band{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red) 0 33.3%,#f3ece0 33.3% 66.6%,var(--blue) 66.6%)}
.adv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px}
.adv small{display:block;color:var(--muted);font-size:14px}
.adv>span{font:800 26px var(--f-display);color:var(--gold);white-space:nowrap}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:60px;color:var(--gold)}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .item .pills{grid-row:auto;grid-column:1;justify-content:flex-start}
}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;resize:vertical;font:inherit;color:inherit}
textarea:focus{border-color:var(--gold)}
.insc{margin-top:10px;display:grid;gap:8px;justify-items:start}

.urg{font-size:14px;text-align:right}

.compte{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.first{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}

.save-alert{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:#3a2a12;border:1px solid #6b5023;color:#f3d39a;font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:10px;font:700 14px var(--f-label);letter-spacing:.06em;text-transform:uppercase;z-index:60;max-width:calc(100% - 32px);text-align:center}
.sec{margin:0 0 22px}
.info{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px}

.info .bd{flex:1;min-width:0}
.info small{display:block;color:var(--gold);font:700 12px var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.info b{display:block;font-size:17px}
.info p{margin:4px 0 8px;color:var(--muted);font-size:15px}
.more{margin-top:10px}
.more summary{cursor:pointer;color:var(--gold-2);font:600 14px var(--f-label);letter-spacing:.06em;text-transform:uppercase;padding:6px 0}
.mini{display:grid;gap:4px;margin-top:6px}
.mini>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:14px}
.mini .r{display:flex;align-items:center;gap:8px}
.mot{position:relative;margin-top:12px;padding:12px 14px;background:linear-gradient(180deg,#2a2114,#1c170f);border:1px solid #5a4520;border-radius:12px}
.mot small,.mot-old small{display:block;color:var(--gold);font:700 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase}

.compet{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.compet .mini>div{background:var(--bg-2)}
.lbl{margin:12px 0 6px;font:700 12px var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fight{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg-2);margin-top:4px;font-size:14px;flex-wrap:wrap}

.fight>span:not(.pill){flex:1;min-width:120px}

.kid-acts{display:grid;gap:8px;margin-top:14px}
.tools2{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}
.relance{margin-bottom:14px}

.xsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

.inline-f{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.inline-f input,.inline-f select{flex:1 1 130px;width:auto;min-height:40px;padding:8px 10px}
.x{border:0;background:transparent;color:#ff8d84;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}
.x:hover{background:#3a1512}
.lbl2{display:block;font:600 13px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.paid{min-height:46px;display:flex;align-items:center;padding:0 14px;border:1px dashed var(--line);border-radius:10px;font-weight:700}
</style>
</head>

<div class="mongkol"></div>
<header>

  <div class="t"><b>Espace adhérent</b><small>Montoiz’ Thaï Khmer Boxing</small></div>
  <a class="back" href="./">← Le site</a>
</header>
<main id="app"><div class="loading"><span class="spin"></span></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== Réglages ===== */
const SB_URL = "https://omnovkheumrwturqugmk.supabase.co";
const SB_KEY = "sb_publishable_rdk1XMA8H6xt0sX9twQXXA_3MndR78o";
const SAISON = "2026-2027";
const GROUPES = ["Baby boxe","Enfants","Ados","Adultes","Compétition","Loisir"];
const MODES = ["Espèces","Chèque","Virement","HelloAsso","Carte bancaire","Pass’Sport","Chèques ANCV"];
const RESULTATS = ["À venir","Victoire","Défaite","Nul","Annulé"];
const VAPID = "BIwVilFY5GizYK9mPZB_uTUmij_b3HRLqfh7UQPUzuohHxtYucxXH7b9g-Tr5yQDNF8ue8rcJZ4n16i-PgZq1DU";
const CLUB = { nom:"Montoiz’ Thaï Khmer Boxing", adresse:"2 Place de l’Église, 26800 Montoison", email:"allexthaikhmerboxing@gmail.com", tel:"06 58 40 32 45", site:"montoizthaikhmerboxing.fr" };

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okMail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||"").trim());
const fmtDate = d => d ? new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString("fr-FR") : "";
const euros = n => (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const age = d => { if(!d) return null; const b=new Date(d+"T12:00:00"), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const today = () => new Date().toLocaleDateString("sv-SE");
const nl2br = t => esc(t).replace(/\n/g,"<br>");
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";

let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }); }
catch(e){ app.innerHTML = `<div class="card login"><h2>Connexion indisponible</h2><p class="note">Le service n’a pas pu se charger. Vérifie ta connexion internet et recharge la page.</p></div>`; }

const S = { user:null, role:null, adh:[], staff:[], avantages:[], pay:[], mots:[], combats:[], infos:[], reg:{}, parts:[], nb:{},
  tab:"adh", q:"", groupe:"", edit:null, confirmDel:false, card:null, relance:null,
  loginStep:"pw", email:"", busy:false, msg:null, mustSetPw:false, pwView:false, push:"na" };
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
const isB = () => S.role==="bureau";
const isStaff = () => S.role==="bureau" || S.role==="coach";
const meNom = () => (S.staff.find(s=>s.email===S.user?.email?.toLowerCase())?.nom) || null;

/* ===== Statuts ===== */
function certStatus(a){
  if(!a.certificat_date) return ["ko","Certificat à fournir"];
  const d = new Date(a.certificat_date+"T12:00:00"), lim = new Date(d); lim.setFullYear(lim.getFullYear()+1);
  if(lim < new Date()) return ["wait","Certificat expiré"];
  return ["ok","Certificat ✓"];
}
function cotStatus(a){
  const due = Number(a.cotisation_due)||0, paid = Number(a.cotisation_payee)||0;
  if(due<=0) return ["n","Cotisation à définir"];

/* ===== Notifications ===== */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_,ko)=>setTimeout(()=>ko(new Error("sw")),8000))]);
function b64u(b){ const p="=".repeat((4-b.length%4)%4), r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
async function pushState(){
  try{
    if(!pushOK()){ S.push = isIOS && !standalone() ? "ios" : "na"; return; }
    if(Notification.permission==="denied"){ S.push="denied"; return; }
    const sub = await (await swReady()).pushManager.getSubscription();
    S.push = sub ? "on" : "off";
  }catch(e){ S.push="na"; }
}
async function pushToggle(btn){
  if(S.push==="ios") return toast("Sur iPhone : installe d’abord l’appli (Partager → Sur l’écran d’accueil), puis ouvre l’espace depuis l’appli.");
  if(S.push==="denied") return toast("Notifications bloquées : autorise-les dans les réglages du navigateur pour ce site.");
  btn.disabled=true;
  try{
    const reg = await swReady();
    if(S.push==="on"){
      const sub = await reg.pushManager.getSubscription();
      if(sub){ await sb.from("push_subs").delete().eq("endpoint",sub.endpoint); await sub.unsubscribe(); }
      S.push="off"; toast("Notifications désactivées");
    } else {
      const perm = await Notification.requestPermission();
      if(perm!=="granted"){ S.push = perm==="denied"?"denied":"off"; render(); return; }
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(VAPID) });
      const j = sub.toJSON();
      const { error } = await sb.from("push_subs").upsert({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth });
      if(error) throw error;
      S.push="on"; toast("Notifications activées 🔔");
    }
  }catch(e){ toast("Impossible d’activer les notifications sur cet appareil."); }
  render();
}
async function notifier(body, silent){
  try{
    const { data, error } = await sb.functions.invoke("notifier", { body });
    if(error) throw error;
    if(!silent) toast(data?.envoyes ? `Notification envoyée à ${data.envoyes} appareil${data.envoyes>1?"s":""}` : "Personne n’a encore activé les notifications");
    return data;
  }catch(e){
    let why = e?.message || "";
    try{ if(e?.context){ why = `${e.context.status||""} ${(await e.context.json())?.error||""}`.trim() || why; } }catch(_){}
    console.warn("notifier", e, why);
    if(!silent) toast("Notification non envoyée : "+(why||"erreur inconnue"));
  }
}
function compteBtns(){
  const n = S.push==="on" ? "🔔 Notifications activées" : S.push==="off" ? "🔔 Activer les notifications" : S.push==="denied" ? "🔕 Notifications bloquées" : S.push==="ios" ? "🔔 Notifications" : "";
  return `<div class="compte">${n?`<button class="btn ghost sm ${S.push==="on"?"on":""}" id="push">${n}</button>`:""}<button class="btn ghost sm" id="pwchange">🔑 Mot de passe</button><button class="btn ghost sm" id="logout">Se déconnecter</button></div>`;

async function load(){

  if(r.error){ return fatal("Impossible de lire ton profil ("+r.error.message+"). La base n’est peut-être pas encore installée."); }
  S.role = r.data || "membre";
  const q = await sb.from("adherents").select("*").order("nom").order("prenom");
  if(q.error) return fatal(q.error.message);
  S.adh = q.data || [];
  const opt = (p) => p.then(x=>x.data||[]).catch(()=>[]);
  const [staff, av, pay, mots, combats, infos, reg, parts, nb] = await Promise.all([
    S.role==="membre" ? Promise.resolve([]) : opt(sb.from("staff").select("*").order("role").order("email")),
    opt(sb.from("avantages").select("*").order("ordre").order("created_at")),
    S.role==="coach" ? Promise.resolve([]) : opt(sb.from("paiements").select("*").order("jour")),
    opt(sb.from("mots").select("*").order("created_at",{ascending:false})),
    opt(sb.from("combats").select("*").order("jour",{ascending:false})),
    opt(sb.from("infos").select("*").order("created_at",{ascending:false})),
    opt(sb.from("reglages").select("*").eq("id",1)),
    opt(sb.from("participations").select("*")),
    opt(sb.rpc("nb_inscrits"))
  ]);
  await pushState();
  Object.assign(S,{staff, avantages:av, pay, mots, combats, infos, reg:reg[0]||{}, parts, nb:Object.fromEntries((nb||[]).map(x=>[x.info_id,Number(x.n)]))});
  render();
}
async function refreshAdh(id){

  if(data){ const i=S.adh.findIndex(x=>x.id===id); if(i>=0) S.adh[i]=data; if(S.edit?.id===id) S.edit={...S.edit, cotisation_payee:data.cotisation_payee}; }
}
function fatal(t){ app.innerHTML = `<div class="card login"><h2>Oups</h2><p class="note">${esc(t)}</p><button class="btn ghost" id="logout">Se déconnecter</button></div>`; }

/* ===== Infos du club (affichage) ===== */
const INFO_T = { annonce:["📣","Annonce"], stage:["🥊","Stage / événement"], document:["📄","Document"] };
function infosHTML(withDel){
  if(!S.infos.length) return withDel?`<div class="empty">Aucune info publiée pour l’instant.</div>`:"";
  const order = {annonce:0, stage:1, document:2};
  return `<div class="list">${[...S.infos].sort((x,y)=>order[x.type]-order[y.type]||String(y.created_at).localeCompare(x.created_at)).map(i=>{
    const [ic,lab]=INFO_T[i.type]||INFO_T.annonce, url=safeUrl(i.lien);
    return `<div class="info"><span class="ic">${ic}</span><div class="bd">
      <small>${lab}${i.jour?` · ${fmtDate(i.jour)}`:""}</small><b>${esc(i.titre)}</b>${i.texte?`<p>${nl2br(i.texte)}</p>`:""}
      ${url?`<a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener">${i.type==="document"?"Ouvrir le document":"En savoir plus"} ↗</a>`:""}
      ${i.inscription?inscrHTML(i,withDel):""}</div>
      ${withDel?`<button class="btn danger sm" data-delinfo="${i.id}">Retirer</button>`:""}</div>`}).join("")}</div>`;
}

/* ===== Inscriptions aux stages ===== */
function inscrHTML(i, bureau){
  const n = S.nb[i.id]||0, plein = i.places!=null && n>=i.places;
  const count = `<span class="pill ${plein?"ko":"n"}">${n}${i.places?` / ${i.places}`:""} inscrit${n>1?"s":""}${plein?" · complet":""}</span>`;
  if(bureau){
    const noms = S.parts.filter(p=>p.info_id===i.id).map(p=>S.adh.find(a=>a.id===p.adherent_id)).filter(Boolean);
    return `<div class="insc">${count}${noms.length?`<details class="more"><summary>Voir les inscrits</summary><div class="mini">${noms.map(a=>`<div><span>${esc(a.prenom)} ${esc(a.nom)}${a.groupe?` <small class="note">· ${esc(a.groupe)}</small>`:""}</span></div>`).join("")}</div></details>`:""}</div>`;
  }
  return `<div class="insc">${count}<div class="insc-btns">${S.adh.map(a=>{
    const on = S.parts.some(p=>p.info_id===i.id && p.adherent_id===a.id);
    return `<button class="btn sm ${on?"":"ghost"}" data-part="${i.id}" data-adh="${a.id}" ${!on&&plein?"disabled":""}>${on?"✓ "+esc(a.prenom)+" inscrit(e)":"+ Inscrire "+esc(a.prenom)}</button>`}).join("")}</div>
    ${S.adh.length&&S.parts.some(p=>p.info_id===i.id)?`<small class="note">Clique à nouveau pour annuler l’inscription.</small>`:""}</div>`;
}
async function togglePart(info_id, adherent_id, btn){
  const on = S.parts.some(p=>p.info_id===info_id && p.adherent_id===adherent_id);
  btn.disabled=true;
  if(on){
    const { error } = await sb.from("participations").delete().eq("info_id",info_id).eq("adherent_id",adherent_id);
    if(error){ btn.disabled=false; return toast("Erreur : "+error.message); }
    S.parts=S.parts.filter(p=>!(p.info_id===info_id && p.adherent_id===adherent_id)); S.nb[info_id]=Math.max(0,(S.nb[info_id]||1)-1);
    toast("Inscription annulée");
  } else {
    const { data, error } = await sb.from("participations").insert({info_id, adherent_id}).select().single();
    if(error){ btn.disabled=false; return toast(/complet|fermées/i.test(error.message)?error.message:"Erreur : "+error.message); }
    S.parts.push(data); S.nb[info_id]=(S.nb[info_id]||0)+1; toast("Inscription enregistrée 👍");
  }
  render();
}

/* ----- Export Excel (CSV) ----- */
function exportCSV(){
  const cols = [["N° membre",numero],["Nom",a=>a.nom],["Prénom",a=>a.prenom],["Naissance",a=>fmtDate(a.naissance)],["Groupe",a=>a.groupe],
    ["Email",a=>a.email],["Email 2",a=>a.email2],["Téléphone",a=>a.telephone],["N° licence",a=>a.licence_num],["Licence validée",a=>a.licence_ok?"Oui":"Non"],
    ["Date certificat",a=>fmtDate(a.certificat_date)],["Cotisation due",a=>a.cotisation_due],["Payé",a=>a.cotisation_payee],["Reste",a=>Math.max(0,(Number(a.cotisation_due)||0)-(Number(a.cotisation_payee)||0))],
    ["Droit à l’image",a=>a.droit_image==null?"":a.droit_image?"Oui":"Non"],["Compétiteur",a=>a.competiteur?"Oui":"Non"],["Catégorie de poids",a=>a.categorie_poids]];
  const cell = v => { let s = v==null ? "" : typeof v==="number" ? String(v).replace(".",",") : String(v); if(/^[=+@\t]/.test(s)) s="'"+s; return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [cols.map(c=>c[0]), ...filtered().map(a=>cols.map(c=>c[1](a)))];
  const csv = "﻿" + rows.map(r=>r.map(cell).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const l = document.createElement("a"); l.href=url; l.download=`adherents-${SAISON}${S.groupe?"-"+S.groupe.toLowerCase().replace(/\s+/g,"-"):""}.csv`; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast("Fichier téléchargé");
}

async function saveAdh(form){
  const f = new FormData(form), o = {};
  for(const k of ["nom","prenom","naissance","groupe","email","email2","telephone","licence_num","certificat_date","categorie_poids","palmares","urgence_nom","urgence_tel"]) o[k] = (f.get(k)||"").toString().trim() || null;
  o.licence_ok = f.get("licence_ok")==="on";
  o.competiteur = f.get("competiteur")==="on";
  o.cotisation_due = Number(f.get("cotisation_due"))||0;
  const di = f.get("droit_image"); o.droit_image = di==="" ? null : di==="1";
  const box = document.getElementById("sheet-msg");
  for(const k of ["email","email2"]) if(o[k] && !okMail(o[k])) { box.innerHTML=`<p class="msg err">L’adresse « ${esc(o[k])} » n’est pas valide.</p>`; return; }
  const btn = document.getElementById("save"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const isNew = !S.edit.id;
  const res = isNew ? await sb.from("adherents").insert({...o, saison:SAISON}).select().single()
                    : await sb.from("adherents").update(o).eq("id",S.edit.id).select().single();
  if(res.error){ btn.disabled=false; btn.textContent="Réessayer"; box.innerHTML=`<p class="msg err">Erreur : ${esc(res.error.message)}</p>`; return; }
  const i = S.adh.findIndex(x=>x.id===res.data.id);
  if(i>=0) S.adh[i]=res.data; else S.adh.push(res.data);
  S.adh.sort((x,y)=>(x.nom+x.prenom).localeCompare(y.nom+y.prenom,"fr"));
  // Après une création, on garde la fiche ouverte pour pouvoir saisir paiements / messages
  S.edit = isNew ? {...res.data} : null; render(); toast(isNew?"Dossier créé":"Dossier enregistré");
}

/* ===== Sauvegarde (bureau) ===== */
const BACKUP_TABLES = ["adherents","paiements","mots","combats","infos","participations","avantages","staff","reglages"];
const joursDepuis = d => d ? Math.floor((Date.now()-new Date(d).getTime())/86400000) : null;
async function sauvegarde(btn){
  const old=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> Préparation…';
  try{
    const out = { club:"Montoiz’ Thaï Khmer Boxing", type:"sauvegarde-espace-adherents", version:1, date:new Date().toISOString(), par:S.user.email, tables:{} };
    for(const t of BACKUP_TABLES){
      let all=[], from=0;
      for(;;){ const { data, error } = await sb.from(t).select("*").range(from, from+999); if(error) throw new Error(t+" : "+error.message); all=all.concat(data||[]); if(!data || data.length<1000) break; from+=1000; }
      out.tables[t]=all;
    }
    const nb = Object.fromEntries(Object.entries(out.tables).map(([k,v])=>[k,v.length]));
    out.resume = nb;
    const url = URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
    const l=document.createElement("a"); l.href=url; l.download=`sauvegarde-montoiz-${today()}.json`; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    const { data } = await sb.from("reglages").update({ derniere_sauvegarde:new Date().toISOString() }).eq("id",1).select().single();
    if(data) S.reg=data;
    render(); toast(`Sauvegarde téléchargée : ${nb.adherents} adhérents, ${nb.paiements} paiements`);
  }catch(e){ btn.disabled=false; btn.innerHTML=old; toast("Sauvegarde impossible : "+e.message); }
}
function rappelSauvegarde(){
  if(!isB()) return "";
  const j = joursDepuis(S.reg?.derniere_sauvegarde);
  if(j!=null && j<30) return "";
  return `<div class="save-alert"><span>💾 ${j==null?"Aucune sauvegarde n’a encore été faite.":`Dernière sauvegarde il y a ${j} jours.`} Pense à en faire une (1 fois par mois).</span><button class="btn sm" data-tab="club">Sauvegarder</button></div>`;
}

  const id=e.target.id, F=e.target;
  if(id==="f-pw"){ const m=document.getElementById("mail").value.trim().toLowerCase(); if(!okMail(m)){S.msg=["err","Cette adresse email n’est pas valide."];viewLogin();return} loginPw(m, document.getElementById("pw").value); }
  if(id==="f-otp"){ const m=document.getElementById("mail").value.trim().toLowerCase(); if(!okMail(m)){S.msg=["err","Cette adresse email n’est pas valide."];viewLogin();return} sendCode(m); }
  if(id==="f-setpw") savePw();
  if(id==="f-code"){ const c=document.getElementById("code").value.replace(/\D/g,""); if(c.length<6){S.msg=["err","Le code fait au moins 6 chiffres."];viewLogin();return} verifyCode(c); }
  if(id==="f-adh") saveAdh(F);
  if(id==="f-staff") addStaff(F);
  if(id==="f-av") addAv(F);
  if(id==="f-pay") addPay(F);
  if(id==="f-mot") addMot(F);
  if(id==="f-comb") addComb(F);
  if(id==="f-info") addInfo(F);
  if(id==="f-club") saveClub(F);
});
document.addEventListener("click", e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if(d.step){ e.preventDefault(); const m=document.getElementById("mail"); if(m&&m.value) S.email=m.value.trim(); S.loginStep=d.step; S.msg=null; viewLogin(); }
  if(d.eye){ const i=document.getElementById(d.eye); i.type = i.type==="password"?"text":"password"; }
  if(t.id==="logout"){ logout(); }
  if(t.id==="push"){ pushToggle(t); }
  if(t.id==="pwchange"){ S.pwView=true; S.edit=null; render(); scrollTo(0,0); }
  if(t.id==="setpw-cancel"){ S.pwView=false; render(); }
  if(t.id==="setpw-later"){ e.preventDefault(); LS.del("mtkb-setpw"); S.mustSetPw=false; render(); }
  if(t.id==="notif-send"){ sendLibre(t); }
  if(d.tab){ S.tab=d.tab; S.relance=null; render(); }
  if(d.card){ S.card=d.card; S.edit=null; render(); scrollTo(0,0); }
  if(d.attest){ attestation(d.attest, t); }
  if(d.qrzoom){ qrZoom(d.qrzoom); }
  if(t.id==="backup"){ sauvegarde(t); }
  if(d.part){ togglePart(d.part, d.adh, t); }
  if(t.id==="card-back"){ S.card=null; render(); }
  if(d.delav){ delAv(d.delav); }
  if(d.delinfo){ delInfo(d.delinfo); }
  if(d.delpay){ delPay(d.delpay); }
  if(d.delmot){ delMot(d.delmot); }
  if(d.delcomb){ delComb(d.delcomb); }
  if(t.id==="add"){ S.edit={ saison:SAISON, licence_ok:false, droit_image:null }; S.confirmDel=false; render(); }
  if(t.classList.contains("item")){ S.edit={...S.adh.find(a=>a.id===d.id)}; S.confirmDel=false; render(); }
  if(t.id==="close"){ S.edit=null; render(); }
  if(t.id==="del"){ S.confirmDel=true; render(); }
  if(t.id==="del-no"){ S.confirmDel=false; render(); }
  if(t.id==="del-yes"){ delAdh(); }
  if(d.unstaff){ removeStaff(d.unstaff); }
  if(t.id==="export"){ exportCSV(); }
  if(t.id==="relance"){ S.relance = S.relance ? null : {type:"cert"}; render(); }
  if(t.id==="relance-x"){ S.relance=null; render(); }
  if(t.id==="rel-open"){ const {mails}=relanceCible(); const su=document.getElementById("rel-sujet").value, co=document.getElementById("rel-corps").value;
    location.href=`mailto:?bcc=${mails.map(encodeURIComponent).join(",")}&subject=${encodeURIComponent(su)}&body=${encodeURIComponent(co)}`; }
  if(t.id==="rel-copy"){ copy(relanceCible().mails.join(", "), "Emails copiés"); }
  if(t.id==="rel-copy-msg"){ copy(document.getElementById("rel-sujet").value+"\n\n"+document.getElementById("rel-corps").value, "Message copié"); }
});
document.addEventListener("click", e=>{ if(e.target.id==="sheet-bg"){ S.edit=null; render(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.edit){ S.edit=null; render(); } });
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; document.getElementById("list").innerHTML=listHTML(filtered()); }
  if(e.target.id==="rel-sujet" && S.relance) S.relance.sujet=e.target.value;
  if(e.target.id==="rel-corps" && S.relance) S.relance.corps=e.target.value;
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="grp"){ S.groupe=t.value; if(S.relance) render(); else document.getElementById("list").innerHTML=listHTML(filtered()); }
  if(t.id==="rel-type"){ S.relance={type:t.value}; render(); }
  if(t.dataset.res){ setRes(t.dataset.res, t.value); }
});

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(/error_description=/.test(location.hash)){
  const p=new URLSearchParams(location.hash.slice(1));
  S.msg=["err", /expired|invalid/i.test(p.get("error_description")||"") ? "Ce lien a expiré ou a déjà servi. Redemande un lien ci-dessous." : (p.get("error_description")||"Connexion impossible.")];
  history.replaceState(null,"",location.pathname);
}
if(sb){
  sb.auth.onAuthStateChange((ev, session)=>{
    const u = session?.user || null;
    if(u && (!S.user || S.user.id!==u.id)){ S.user=u; if(LS.get("mtkb-setpw")) S.mustSetPw=true; if(location.hash.includes("access_token")) history.replaceState(null,"",location.pathname); setTimeout(load,0); }
    else if(!u && S.user){ Object.assign(S,{card:null,user:null,role:null,adh:[],staff:[],pay:[],mots:[],combats:[],infos:[],parts:[],nb:{},edit:null,relance:null,loginStep:"pw",msg:null,mustSetPw:false,pwView:false}); render(); }
    else if(!u && ev==="INITIAL_SESSION"){ render(); }
  });
}
</script>
</body>
</html>
