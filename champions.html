<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nos champions · Montoiz’ Thaï Khmer Boxing</title>
<meta name="description" content="L’équipe compétition de Montoiz’ Thaï Khmer Boxing (Montoison, Drôme) : nos combattants, leur palmarès et les prochains galas.">
<link rel="canonical" href="https://montoizthaikhmerboxing.fr/champions.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0b09">
<meta property="og:title" content="Nos champions · Montoiz’ Thaï Khmer Boxing">
<meta property="og:image" content="https://montoizthaikhmerboxing.fr/partage.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Barlow:wght@400;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
:root{--bg:#0d0b09;--bg2:#16130f;--line:#3a3125;--fg:#f3ece0;--mut:#b4a790;--gold:#e0b04a;--gold2:#f5cf72;--ink:#1a1206;--red:#d2453c;--blue:#3c6fd2;
  --fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Barlow",system-ui,sans-serif;--fl:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--fb)}
a{color:var(--gold2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header{background:var(--bg2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
header img{width:40px;height:40px;border-radius:50%}
header b{display:block;font:800 22px/1 var(--fd);text-transform:uppercase}
header small{display:block;color:var(--gold);font:700 11px var(--fl);letter-spacing:.16em;text-transform:uppercase}
header .back{margin-left:auto;font:700 14px var(--fl);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.mk{height:4px;background:linear-gradient(90deg,var(--red) 0 33.3%,#f3ece0 33.3% 66.6%,var(--blue) 66.6%)}
.preview{background:#3a2a12;color:#f3d39a;border-bottom:1px solid #6b5023;padding:10px 0;font-size:15px}
.hero{padding:44px 0 26px;background:radial-gradient(ellipse at 80% 0,#4a391655,transparent 60%)}
.eb{font:700 13px var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{font:900 clamp(52px,10vw,96px)/.9 var(--fd);text-transform:uppercase;margin:8px 0 12px}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:var(--mut);max-width:58ch;font-size:17px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font:900 44px/1 var(--fd);color:var(--gold2)}
.kpi small{color:var(--mut);font:700 12px var(--fl);letter-spacing:.1em;text-transform:uppercase}
h2{font:800 34px var(--fd);text-transform:uppercase;margin:40px 0 14px}
.next{display:grid;gap:10px}
.ev{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#2a2114,var(--bg2));border:1px solid #5a4520;border-radius:14px;padding:14px 16px}
.date{flex:none;width:64px;text-align:center;background:var(--gold);color:var(--ink);border-radius:10px;padding:6px 0}
.date b{display:block;font:900 30px/1 var(--fd)}
.date small{font:700 12px var(--fl);letter-spacing:.1em;text-transform:uppercase}
.ev .t b{display:block;font:800 22px/1.1 var(--fd);text-transform:uppercase}
.ev .t span{color:var(--mut);font-size:14px}
.ev .who{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:700 12px var(--fl);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.f{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,#3a2c14,#120f0b);display:grid;place-items:center;overflow:hidden}
.ph .ini{font:900 92px var(--fd);color:#e0b04a33}
.ph img{position:absolute;right:-30px;bottom:-40px;width:200px;opacity:.12}
.ph img.photo{inset:0;right:auto;bottom:auto;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:1}
.ph.has::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#000c)}
.ph .cat,.ph .title{z-index:1}
.ph .cat{position:absolute;left:12px;top:12px;background:var(--gold);color:var(--ink);font:700 12px var(--fl);letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.ph .title{position:absolute;left:12px;bottom:12px;right:12px;font:700 13px var(--fl);letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)}
.bd{padding:14px 16px 16px}
.bd h3{margin:0;font:900 30px/1 var(--fd);text-transform:uppercase}
.bd .grp{color:var(--mut);font-size:14px;margin:2px 0 0}
.pal{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:6px;font-size:14px}
.pal li{display:flex;gap:8px}
.pal li::before{content:"🏆"}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.cta{margin:40px 0 50px;padding:22px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta b{font:800 26px var(--fd);text-transform:uppercase}
.btn{display:inline-block;background:var(--gold);color:var(--ink);font:700 15px var(--fl);letter-spacing:.08em;text-transform:uppercase;padding:12px 18px;border-radius:10px;text-decoration:none}
.spin{display:block;width:28px;height:28px;margin:90px auto;border:3px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.off{max-width:520px;margin:70px auto;text-align:center}
footer{padding:24px 0 40px;color:var(--mut);font-size:14px;text-align:center}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.kpi b{font-size:36px}.ev{flex-wrap:wrap}.ev .who{margin-left:80px;justify-content:flex-start}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="./"><img src="icon-192.png" alt=""><span><b>Montoiz’</b><small>Thaï Khmer Boxing</small></span></a><a class="back" href="./">← Le site</a></div></header>
<div class="mk"></div>
<div id="app"><span class="spin"></span></div>
<footer>Montoiz’ Thaï Khmer Boxing · Montoison (26) · <a href="./#contact">Contact</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://omnovkheumrwturqugmk.supabase.co", SB_KEY="sb_publishable_rdk1XMA8H6xt0sX9twQXXA_3MndR78o";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["Jan","Fév","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
function saison(){ const d=new Date(), y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1; return `${y} – ${y+1}`; }
function lignes(t){ return String(t||"").split(/\n+/).map(x=>x.replace(/^[-•·*\s]+/,"").trim()).filter(Boolean); }

function off(){
  app.innerHTML=`<div class="wrap off"><div class="eb">Bientôt</div><h1 style="font-size:56px">Nos <em>champions</em></h1>
    <p class="lead" style="margin:0 auto 22px">Cette page arrive bientôt. En attendant, découvre le club et viens essayer un cours.</p>
    <a class="btn" href="./#demande">Réserver un cours d’essai →</a></div>`;
}
function page(d){
  const cs=d.combattants||[], evs=d.combats||[];
  const titres=cs.reduce((n,c)=>n+lignes(c.palmares).length,0);
  const ev = e => { const j=e.jour?new Date(e.jour+"T12:00:00"):null;
    return `<div class="ev"><div class="date">${j?`<b>${j.getDate()}</b><small>${MOIS[j.getMonth()]}</small>`:`<b>?</b><small>Date</small>`}</div>
      <div class="t"><b>${esc(e.evenement)}</b>${e.lieu?`<span>${esc(e.lieu)}</span>`:""}</div>
      <div class="who">${(e.qui||[]).map(q=>`<span class="chip">${esc(q)}</span>`).join("")}</div></div>`; };
  const carte = c => { const pal=lignes(c.palmares);
    const photo = /^https:\/\//.test(c.photo||"") ? c.photo : "";
    return `<article class="f"><div class="ph ${photo?"has":""}">${photo?`<img class="photo" src="${esc(photo)}" alt="${esc(c.prenom)}" loading="lazy">`:`<span class="ini">${esc((c.prenom||"?")[0]+c.initiale)}</span><img src="icon-192.png" alt="">`}
      ${c.categorie?`<span class="cat">${esc(c.categorie)}</span>`:""}${pal[0]?`<span class="title">${esc(pal[0])}</span>`:""}</div>
      <div class="bd"><h3>${esc(c.prenom)} ${esc(c.initiale)}.</h3>${c.groupe?`<div class="grp">${esc(c.groupe)}</div>`:""}
      ${pal.length?`<ul class="pal">${pal.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}</div></article>`; };
  app.innerHTML=`${d.en_ligne?"":`<div class="preview"><div class="wrap">👁 <b>Aperçu bureau</b> : cette page est <b>hors ligne</b>, les visiteurs ne la voient pas. Mets-la en ligne depuis l’espace bureau → Réglages.</div></div>`}
  <section class="hero"><div class="wrap">
    <div class="eb">Saison ${saison()} · Équipe compétition</div>
    <h1>Nos <em>champions</em></h1>
    <p class="lead">Ils portent les couleurs de Montoison sur les rings de la région et de France. Palmarès et prochains galas mis à jour par les coachs.</p>
    <div class="kpis"><div class="kpi"><b>${cs.length}</b><small>Combattant${cs.length>1?"s":""}</small></div><div class="kpi"><b>${titres}</b><small>Titres &amp; podiums</small></div><div class="kpi"><b>${evs.length}</b><small>Gala${evs.length>1?"s":""} à venir</small></div></div>
  </div></section>
  <div class="wrap">
    ${evs.length?`<h2>Prochains combats</h2><div class="next">${evs.map(ev).join("")}</div>`:""}
    <h2>L’équipe</h2>
    ${cs.length?`<div class="grid">${cs.map(carte).join("")}</div>`:`<div class="empty">L’équipe compétition sera bientôt présentée ici.</div>`}
    <div class="cta"><div><b>Envie de monter sur le ring ?</b></div><a class="btn" href="./#demande">Réserver un cours d’essai →</a></div>
  </div>`;
}
(async()=>{
  try{
    const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    const {data,error}=await sb.rpc("champions");
    if(error) throw error;
    if(!data||!data.acces) return off();
    page(data);
  }catch(e){ off(); }
})();
</script>
</body>
</html>
